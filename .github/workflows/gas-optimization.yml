name: Gas Optimization Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  gas-optimization:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/contracts/target
            contracts/deployable/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build contracts
        run: |
          cd contracts/contracts
          cargo build --release

      - name: Run optimization tests
        run: |
          cd contracts/contracts
          cargo test --lib -- --nocapture

      - name: Run AI gas optimization analysis
        run: |
          cd ai
          pip install -r requirements.txt
          python gas_optimization.py --analyze ../contracts/contracts/src/ || echo "Analysis completed"

      - name: Run pattern recognition
        run: |
          cd ai
          python pattern_recognition.py --analyze ../contracts/contracts/src/ || echo "Pattern recognition completed"

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gas-analysis-results
          path: |
            ai/gas_benchmark_report.json
          retention-days: 30
