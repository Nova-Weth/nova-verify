name: Performance Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Install load test tool
        run: npm install -g autocannon

      - name: Start server and run load test
        run: |
          npm start &
          sleep 10
          autocannon -c 10 -d 10 http://localhost:4000/health
